name: refresh

# Manual test harness only. The live site (gh-pages) is refreshed by a separate job and
# must NOT be touched from here: no schedule, no publish step.
# Note: workflow_dispatch works only once this file is on the repository's default branch.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (pypdf + OCR for image-only 278-T PDFs)
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr poppler-utils

      # 278e annual + 278-T PDFs: ~80 MB, too big for git; keep them between runs
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: pdf-cache-${{ github.run_id }}
          restore-keys: pdf-cache-

      - name: Refresh data and rebuild page
        run: ./run_all.sh

      - name: Save state (data/*.json + page) back to main
        run: |
          git config user.name "market-monitor-bot"
          git config user.email "market-monitor-bot@users.noreply.github.com"
          git add data/*.json app/index.html
          git diff --cached --quiet || git commit -m "refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin main
