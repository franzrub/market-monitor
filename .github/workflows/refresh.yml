name: refresh (test)

# TEST HARNESS — does NOT publish. The live site is still deployed by the QM cron.
# Runs the same pipeline as QM (scripts/refresh.py, without run_all.sh's gh-pages step)
# and uploads the built page as an artifact to compare with the live one.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (pypdf + OCR for image-only 278-T PDFs)
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr poppler-utils

      # 278e annual + 278-T PDFs and their OCR text: too big for git, kept between runs
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: pdf-cache-${{ github.run_id }}
          restore-keys: pdf-cache-

      - name: Refresh data and rebuild page (no deploy)
        run: python3 -u scripts/refresh.py

      - uses: actions/upload-artifact@v4
        with:
          name: market-monitor-build
          path: |
            app/index.html
            data/*.json
