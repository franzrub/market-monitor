name: refresh

# Mon/Wed/Fri 20:30 UTC = 22:30 CEST (21:30 CET in winter).
# Scheduled runs only fire from the repository's DEFAULT branch.
on:
  schedule:
    - cron: "30 20 * * 1,3,5"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish app/index.html to gh-pages"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (pypdf + OCR for image-only 278-T PDFs)
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr poppler-utils

      # 278e annual + 278-T PDFs: ~80 MB, too big for git; keep them between runs
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: pdf-cache-${{ github.run_id }}
          restore-keys: pdf-cache-

      - name: Refresh data and rebuild page
        run: ./run_all.sh

      - name: Save state (data/*.json + page) back to main
        run: |
          git config user.name "market-monitor-bot"
          git config user.email "market-monitor-bot@users.noreply.github.com"
          git add data/*.json app/index.html
          git diff --cached --quiet || git commit -m "refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin main

      # Publishing is opt-in: set the repository variable DEPLOY_PAGES=true
      # (Settings → Secrets and variables → Actions → Variables), or tick "deploy"
      # on a manual run.
      - name: Publish to gh-pages
        if: ${{ inputs.deploy || vars.DEPLOY_PAGES == 'true' }}
        run: |
          d=$(mktemp -d)
          cp app/index.html "$d/index.html"
          cd "$d"
          git init -q -b gh-pages
          git config user.name "market-monitor-bot"
          git config user.email "market-monitor-bot@users.noreply.github.com"
          git add index.html
          git commit -q -m "deploy index.html"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
